services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - clinic_mysql:/var/lib/mysql
    networks:
      - clinic
      - evolution
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/clinic/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - clinic_state:/app/.demo-state
    networks:
      - clinic
      - evolution

  # Executa a varredura periodicamente na rede privada. Não há porta publicada
  # nem acesso ao banco: a mutação continua concentrada na rota autenticada do
  # backend, com um token específico para este processo.
  sla-sweeper:
    build:
      context: ../..
      dockerfile: infra/clinic/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      SLA_SWEEP_URL: http://web:3000/api/application/triagem/sla-sweep
    command: ["node", "infra/clinic/sla-sweep.mjs"]
    depends_on:
      web:
        condition: service_started
    networks:
      - clinic

volumes:
  clinic_mysql:
  clinic_state:

networks:
  clinic:
  evolution:
    name: viver-mais-evolution_evolution
    external: true
